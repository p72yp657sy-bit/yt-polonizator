<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>YT Polonizator Mobile</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { background-color: #0f0f0f; color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; min-height: 100vh; display: flex; flex-direction: column; }
    header { background-color: #1f1f1f; padding: 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #333; position: sticky; top: 0; z-index: 100; }
    .logo { display: flex; align-items: center; gap: 8px; font-weight: bold; font-size: 18px; color: #ff0000; }
    .logo span { color: #fff; }
    .badge-pwa { background: #00e1ff; color: #000; font-size: 10px; padding: 2px 6px; border-radius: 4px; font-weight: bold; }
    main { flex: 1; padding: 16px; max-width: 600px; margin: 0 auto; width: 100%; display: flex; flex-direction: column; gap: 16px; }
    .card { background-color: #1f1f1f; border-radius: 12px; padding: 16px; border: 1px solid #333; }
    .card-title { font-size: 14px; color: #aaa; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.5px; }
    .input-group { display: flex; flex-direction: column; gap: 10px; }
    input[type="text"] { width: 100%; padding: 14px; background-color: #0f0f0f; border: 1px solid #444; border-radius: 8px; color: #fff; font-size: 15px; outline: none; }
    input[type="text"]:focus { border-color: #ff0000; }
    .btn { width: 100%; padding: 14px; border: none; border-radius: 8px; font-weight: bold; font-size: 15px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .btn-primary { background-color: #ff0000; color: white; }
    .btn-secondary { background-color: #333; color: white; }
    .player-container { position: relative; width: 100%; padding-top: 56.25%; background-color: #000; border-radius: 12px; overflow: hidden; border: 1px solid #333; }
    .player-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
    
    .subtitle-box { 
      margin-top: 10px;
      background: #111; 
      color: #00ff88; 
      padding: 16px; 
      border-radius: 12px; 
      text-align: center; 
      font-size: 17px; 
      font-weight: bold;
      border: 2px solid #00ff88;
      min-height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1.4;
      box-shadow: 0 0 10px rgba(0,255,136,0.2);
    }

    .controls-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .status-badge { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: #aaa; margin-top: 8px; }
    .status-dot { width: 8px; height: 8px; background-color: #00ff88; border-radius: 50%; }
    footer { text-align: center; padding: 16px; font-size: 12px; color: #666; }
  </style>
</head>
<body>

  <header>
    <div class="logo">▶ <span>YT Polonizator</span></div>
    <div class="badge-pwa">API REALTIME ACTIVE</div>
  </header>

  <main>
    <div class="card">
      <div class="card-title">1. Link do angielskiego filmu</div>
      <div class="input-group">
        <input type="text" id="ytUrl" placeholder="Wklej link YouTube..." value="https://www.youtube.com/watch?v=a0kTvGsdiOQ">
        <div class="controls-grid">
          <button class="btn btn-secondary" onclick="pasteFromClipboard()">📋 Wklej</button>
          <button class="btn btn-primary" onclick="loadAndTranslateSubtitles()">💬 Pokaż Napisy PL</button>
        </div>
      </div>
    </div>

    <div class="player-container" id="playerContainer">
      <iframe id="ytIframe" src="https://www.youtube-nocookie.com/embed/a0kTvGsdiOQ?enablejsapi=1" allow="autoplay; encrypted-media" allowfullscreen></iframe>
    </div>

    <div class="subtitle-box" id="subtitleBox">
      Kliknij "Pokaż Napisy PL", aby wczyłać pełną transkrypcję.
    </div>

    <div class="card">
      <div class="card-title">2. Status Tłumaczenia</div>
      <div class="status-badge">
        <div class="status-dot" id="statusDot"></div>
        <span id="statusText">System gotowy</span>
      </div>
    </div>
  </main>

  <footer>YT Polonizator</footer>

  <script>
    let subtitleQueue = [];
    let queueIndex = 0;
    let timer = null;

    function extractVideoId(rawInput) {
      if (!rawInput) return null;
      let clean = rawInput.replace(/[\[\]\s]/g, '');
      const reg = /(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?)\/|.*[?&]v=)|youtu\.be\/)([^"&?\/\s]{11})/;
      const match = clean.match(reg);
      return match ? match[1] : null;
    }

    async function pasteFromClipboard() {
      try {
        const text = await navigator.clipboard.readText();
        if (text) document.getElementById('ytUrl').value = text;
      } catch (err) {
        alert('Wklej link ręcznie.');
      }
    }

    async function fetchFullSubtitles(videoId) {
      try {
        // Wywołanie otwartego serwisu pozyskującego napisy
        const res = await fetch(`https://yt-subtitles-api.vercel.app/api/subtitles?v=${videoId}&lang=pl`);
        if (res.ok) {
          const data = await res.json();
          if (data && data.lines && data.lines.length > 0) {
            return data.lines;
          }
        }
      } catch (e) {
        console.warn("Błąd API główny, próba źródła awaryjnego...", e);
      }

      // Rezerwowe API transkrypcji
      try {
        const res = await fetch(`https://caption-extractor.vercel.app/api/captions?id=${videoId}`);
        if (res.ok) {
          const data = await res.json();
          if (Array.isArray(data) && data.length > 0) {
            return data.map(item => item.text);
          }
        }
      } catch (e) {
        console.error("Nie udało się pobrać napisów z drugiego źródła", e);
      }

      return null;
    }

    async function loadAndTranslateSubtitles() {
      const rawUrl = document.getElementById('ytUrl').value;
      const videoId = extractVideoId(rawUrl);

      if (!videoId) {
        alert('Niepoprawny link YouTube!');
        return;
      }

      document.getElementById('statusText').innerText = "Pobieranie pełnej transkrypcji...";
      document.getElementById('subtitleBox').innerText = "⌛ Ładowanie pełnej listy napisów...";

      const iframe = document.getElementById('ytIframe');
      iframe.src = `https://www.youtube-nocookie.com/embed/${videoId}?autoplay=1&enablejsapi=1`;

      const lines = await fetchFullSubtitles(videoId);

      if (lines && lines.length > 0) {
        subtitleQueue = lines;
        startSubtitles();
      } else {
        document.getElementById('statusText').innerText = "Błąd pobierania";
        document.getElementById('subtitleBox').innerText = "⚠️ YouTube zablokował automatyczne pobieranie napisów dla tego wideo.";
      }
    }

    function startSubtitles() {
      if (timer) clearInterval(timer);
      queueIndex = 0;
      document.getElementById('statusText').innerText = `Pobrano ${subtitleQueue.length} kwestii dialogowych. Wyświetlanie...`;

      function playNext() {
        if (queueIndex < subtitleQueue.length) {
          document.getElementById('subtitleBox').innerText = "🇵🇱 " + subtitleQueue[queueIndex];
          queueIndex++;
        } else {
          queueIndex = 0;
        }
      }

      playNext();
      timer = setInterval(playNext, 3200);
    }
  </script>
</body>
</html>
