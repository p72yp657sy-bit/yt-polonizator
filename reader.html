<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>YT Polonizator - Lektor PL Dual</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { background-color: #0f0f0f; color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; min-height: 100vh; display: flex; flex-direction: column; }
    header { background-color: #1f1f1f; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #333; position: sticky; top: 0; z-index: 100; }
    .logo { display: flex; align-items: center; gap: 8px; font-weight: bold; font-size: 16px; color: #ff0000; }
    .logo span { color: #fff; }
    .badge-pwa { background: #ff9900; color: #000; font-size: 10px; padding: 2px 6px; border-radius: 4px; font-weight: bold; }
    main { flex: 1; padding: 12px; max-width: 500px; margin: 0 auto; width: 100%; display: flex; flex-direction: column; gap: 12px; }
    .card { background-color: #1f1f1f; border-radius: 12px; padding: 12px; border: 1px solid #333; }
    .card-title { font-size: 12px; color: #aaa; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
    .input-group { display: flex; flex-direction: column; gap: 8px; }
    input[type="text"] { width: 100%; padding: 12px; background-color: #0f0f0f; border: 1px solid #444; border-radius: 8px; color: #fff; font-size: 14px; outline: none; }
    
    .player-container { 
      position: relative; 
      width: 100%; 
      padding-top: 56.25%; 
      background-color: #000; 
      border-radius: 12px; 
      overflow: hidden; 
      border: 1px solid #333; 
    }
    .player-container iframe, .player-container div { 
      position: absolute; 
      top: 0; 
      left: 0; 
      width: 100% !important; 
      height: 100% !important; 
    }
    
    .subtitle-box { 
      background: #111; 
      color: #ff9900; 
      padding: 12px; 
      border-radius: 12px; 
      text-align: center; 
      font-size: 15px; 
      font-weight: bold;
      border: 2px solid #ff9900;
      min-height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1.3;
      box-shadow: 0 0 10px rgba(255,153,0,0.2);
    }

    .controls-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: bold; font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }
    .btn-primary { background-color: #ff0000; color: white; }
    .btn-secondary { background-color: #333; color: white; }
    .btn-speaker { background-color: #ff9900; color: #000; }
    .status-badge { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: #aaa; }
    .status-dot { width: 8px; height: 8px; background-color: #ff9900; border-radius: 50%; }
    footer { text-align: center; padding: 12px; font-size: 11px; color: #666; }
  </style>
</head>
<body>

  <header>
    <div class="logo">▶ <span>YT Polonizator</span></div>
    <div class="badge-pwa">DUAL VOICE V2</div>
  </header>

  <main>
    <div class="card">
      <div class="card-title">1. Link do filmu</div>
      <div class="input-group">
        <input type="text" id="ytUrl" placeholder="Wklej link YouTube..." value="https://www.youtube.com/watch?v=a0kTvGsdiOQ">
        <div class="controls-grid">
          <button class="btn btn-secondary" onclick="pasteFromClipboard()">📋 Wklej</button>
          <button class="btn btn-primary" onclick="loadVideo()">💬 Uruchom Lektora</button>
        </div>
      </div>
    </div>

    <div class="player-container">
      <div id="player"></div>
    </div>

    <button class="btn btn-speaker" onclick="testVoice()">🔊 Włącz / Odblokuj Lektora</button>

    <div class="subtitle-box" id="subtitleBox">
      Stuknij "Włącz / Odblokuj Lektora", a potem uruchom film.
    </div>

    <div class="card">
      <div class="card-title">2. Status Synchronizacji</div>
      <div class="status-badge">
        <div class="status-dot" id="statusDot"></div>
        <span id="statusText">Oczekuję na start</span>
      </div>
    </div>
  </main>

  <footer>YT Polonizator - Lektor Męski / Żeński</footer>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    let player;
    let synth = window.speechSynthesis;
    let maleVoice = null;
    let femaleVoice = null;
    let syncInterval = null;
    let lastSpokenIndex = -1;

    // Przykładowa osadzona ścieżka dialogowa z czasem i płcią (M/F)
    const mockSubtitles = [
      { start: 2, end: 5, gender: 'F', text: "Cześć! Opowiedzieć Ci o nowym lokatorze?" },
      { start: 6, end: 9, gender: 'F', text: "Oto Hector z Argentyny!" },
      { start: 10, end: 14, gender: 'M', text: "Cześć wszystkim, bardzo mi miło Was poznać." },
      { start: 15, end: 18, gender: 'F', text: "Chodź, pokażę Ci Twój pokój." }
    ];

    function setupVoices() {
      let voices = synth.getVoices();
      let plVoices = voices.filter(v => v.lang.includes('pl'));
      
      if (plVoices.length > 1) {
        femaleVoice = plVoices[0];
        maleVoice = plVoices[1];
      } else if (plVoices.length === 1) {
        femaleVoice = plVoices[0];
        maleVoice = plVoices[0];
      } else {
        femaleVoice = voices[0];
        maleVoice = voices[0];
      }
    }

    if (speechSynthesis.onvoiceschanged !== undefined) {
      speechSynthesis.onvoiceschanged = setupVoices;
    }

    function testVoice() {
      setupVoices();
      speakText("Lektor męski i żeński zostały aktywowane.", 'F');
      document.getElementById('subtitleBox').innerText = "🔊 Lektorzy gotowi!";
    }

    function speakText(text, gender) {
      if (synth.speaking) synth.cancel();
      let utter = new SpeechSynthesisUtterance(text);
      utter.lang = 'pl-PL';
      
      if (gender === 'M') {
        utter.pitch = 0.8; // Niższy ton (głos męski)
        if (maleVoice) utter.voice = maleVoice;
      } else {
        utter.pitch = 1.2; // Wyższy ton (głos żeński)
        if (femaleVoice) utter.voice = femaleVoice;
      }

      utter.rate = 1.1;
      synth.speak(utter);
    }

    function startSubtitleSync() {
      if (syncInterval) clearInterval(syncInterval);
      
      syncInterval = setInterval(() => {
        if (!player || typeof player.getCurrentTime !== 'function') return;
        
        let currentTime = player.getCurrentTime();
        let state = player.getPlayerState();

        if (state === YT.PlayerState.PLAYING) {
          let currentSubIndex = mockSubtitles.findIndex(s => currentTime >= s.start && currentTime <= s.end);
          
          if (currentSubIndex !== -1 && currentSubIndex !== lastSpokenIndex) {
            lastSpokenIndex = currentSubIndex;
            let sub = mockSubtitles[currentSubIndex];
            
            document.getElementById('subtitleBox').innerText = (sub.gender === 'M' ? "👨 " : "👩 ") + sub.text;
            speakText(sub.text, sub.gender);
          }
        }
      }, 300);
    }

    function onYouTubeIframeAPIReady() {
      initPlayer('a0kTvGsdiOQ');
    }

    function initPlayer(videoId) {
      if (player && typeof player.loadVideoById === 'function') {
        player.loadVideoById({ videoId: videoId });
      } else {
        player = new YT.Player('player', {
          videoId: videoId,
          playerVars: { 'autoplay': 0, 'playsinline': 1 },
          events: {
            'onReady': onPlayerReady,
            'onStateChange': onPlayerStateChange
          }
        });
      }
    }

    function onPlayerReady() {
      document.getElementById('statusText').innerText = "Gotowy do odtwarzania";
      setupVoices();
    }

    function onPlayerStateChange(event) {
      if (event.data === YT.PlayerState.PLAYING) {
        document.getElementById('statusText').innerText = "Odtwarzanie z lektorem...";
        startSubtitleSync();
      } else if (event.data === YT.PlayerState.PAUSED) {
        document.getElementById('statusText').innerText = "Wstrzymano";
        if (synth.speaking) synth.cancel();
      }
    }

    function extractVideoId(rawInput) {
      if (!rawInput) return null;
      let clean = rawInput.replace(/[\[\]\s]/g, '');
      const reg = /(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?)\/|.*[?&]v=)|youtu\.be\/)([^"&?\/\s]{11})/;
      const match = clean.match(reg);
      return match ? match[1] : null;
    }

    async function pasteFromClipboard() {
      try {
        const text = await navigator.clipboard.readText();
        if (text) document.getElementById('ytUrl').value = text;
      } catch (err) {
        alert('Wklej link ręcznie.');
      }
    }

    function loadVideo() {
      const rawUrl = document.getElementById('ytUrl').value;
      const videoId = extractVideoId(rawUrl);

      if (!videoId) {
        alert('Niepoprawny link YouTube!');
        return;
      }

      lastSpokenIndex = -1;
      document.getElementById('statusText').innerText = "Ładowanie filmu...";
      initPlayer(videoId);
    }
  </script>
</body>
</html>
