<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polski YouTube - Wersja 4.0</title>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .brand-title {
            font-size: 1.5rem;
            font-weight: bold;
            background: linear-gradient(to right, #ec4899, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
            margin-bottom: 5px;
        }
        .brand-subtitle {
            font-size: 0.85rem;
            color: #94a3b8;
            text-align: center;
            margin-bottom: 20px;
        }
        .input-group {
            display: flex;
            gap: 10px;
            width: 100%;
            max-width: 500px;
            margin-bottom: 20px;
        }
        #song-input {
            flex: 1;
            padding: 12px 15px;
            border-radius: 8px;
            border: 1px solid #334155;
            background-color: #1e293b;
            color: #fff;
            font-size: 1rem;
        }
        #send-btn {
            padding: 0 20px;
            border-radius: 8px;
            border: none;
            background: linear-gradient(to right, #ec4899, #8b5cf6);
            color: white;
            font-weight: bold;
            cursor: pointer;
            font-size: 1rem;
        }
        .player-container {
            width: 100%;
            max-width: 500px;
            height: 280px;
            background-color: #1e293b;
            border-radius: 12px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .player-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        #status {
            width: 100%;
            max-width: 500px;
            padding: 12px;
            background-color: #065f46;
            color: #d1fae5;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 20px;
            font-weight: bold;
        }
        .lyrics-grid {
            display: flex;
            gap: 15px;
            width: 100%;
            max-width: 500px;
        }
        .lyrics-box {
            flex: 1;
            background-color: #1e293b;
            border-radius: 12px;
            padding: 15px;
            min-height: 200px;
            border: 1px solid #334155;
        }
        .lyrics-box h3 {
            font-size: 0.9rem;
            color: #94a3b8;
            margin-top: 0;
            border-bottom: 1px solid #334155;
            padding-bottom: 8px;
            text-transform: uppercase;
        }
        .nav-link {
            margin-top: 20px;
            text-align: center;
        }
        .nav-link a {
            color: #38bdf8;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <div class="brand-title">POLSKI YOUTUBE</div>
    <div class="brand-subtitle">WERSJA 4.0 – ŻĄDANIA I TEKSTY Z VERCELA</div>

    <div class="input-group">
        <input type="text" id="song-input" placeholder="Wpisz tytuł i wykonawcę...">
        <button id="send-btn">Szukaj</button>
    </div>

    <div class="player-container">
        <div id="player">Tutaj pojawi się odtwarzacz...</div>
    </div>

    <div id="status">Status: Oczekiwanie na zapytanie...</div>

    <div class="lyrics-grid">
        <div class="lyrics-box">
            <h3>Oryginalny tekst</h3>
            <p id="original-lyrics" style="color: #71717a; font-weight: normal;">Tutaj pojawi się tekst utworu...</p>
        </div>
        <div class="lyrics-box">
            <h3>Polskie tłumaczenie</h3>
            <p id="translated-lyrics" style="color: #38bdf8; font-weight: normal;">Tutaj pojawi się tłumaczenie...</p>
        </div>
    </div>

    <div class="nav-link">
        <a href="chat-3.1.html">&larr; Wróć do wersji 3.1</a>
    </div>

    <script>
        const VERCEL_API_URL = "https://yt-polonizator-backend-rsbl.vercel.app";

        function loadVideo(videoId) {
            if (!videoId) return;
            const playerContainer = document.querySelector('.player-container');
            playerContainer.innerHTML = `<iframe src="https://www.youtube.com/embed/${videoId}" allowfullscreen></iframe>`;
        }

        async function requestSongLyrics() {
            const query = document.getElementById('song-input').value.trim();
            if (!query) {
                alert("Wpisz tytuł lub wykonawcę!");
                return;
            }

            document.getElementById('status').innerText = `Wysyłanie zapytania do Vercela dla: ${query}`;

            try {
                const response = await fetch(`${VERCEL_API_URL}/api/lyrics`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ query: query })
                });

                if (!response.ok) {
                    throw new Error('Błąd serwera Vercel');
                }

                const data = await response.json();

                if (data.videoId) {
                    loadVideo(data.videoId);
                }

                document.getElementById('status').innerText = 'Odtwarzanie i tłumaczenie gotowe!';

                document.getElementById('original-lyrics').innerText = data.originalLyrics || "Brak oryginalnego tekstu.";
                document.getElementById('translated-lyrics').innerText = data.translatedLyrics || "Brak tłumaczenia.";

            } catch (err) {
                console.error(err);
                document.getElementById('status').innerText = 'Błąd połączenia z serwerem.';
                alert('Nie udało się pobrać danych z serwera.');
            }
        }

        // Bezpieczne powiązanie przycisku Szukaj
        document.getElementById('send-btn').addEventListener('click', requestSongLyrics);
        
        // Obsługa wciśnięcia klawisza Enter w polu input
        document.getElementById('song-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                requestSongLyrics();
            }
        });
    </script>
</body>
</html>
