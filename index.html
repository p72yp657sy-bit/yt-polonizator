<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>YT Polonizator Mobile</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #0f0f0f;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background-color: #1f1f1f;
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #333;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: bold;
      font-size: 18px;
      color: #ff0000;
    }

    .logo span {
      color: #fff;
    }

    .badge-pwa {
      background: #ff0000;
      color: white;
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: bold;
    }

    main {
      flex: 1;
      padding: 16px;
      max-width: 600px;
      margin: 0 auto;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .card {
      background-color: #1f1f1f;
      border-radius: 12px;
      padding: 16px;
      border: 1px solid #333;
    }

    .card-title {
      font-size: 14px;
      color: #aaa;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    input[type="text"] {
      width: 100%;
      padding: 14px;
      background-color: #0f0f0f;
      border: 1px solid #444;
      border-radius: 8px;
      color: #fff;
      font-size: 15px;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: #ff0000;
    }

    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.2s;
    }

    .btn-primary {
      background-color: #ff0000;
      color: white;
    }

    .btn-primary:active {
      background-color: #cc0000;
    }

    .btn-secondary {
      background-color: #333;
      color: white;
    }

    .btn-secondary:active {
      background-color: #444;
    }

    .player-container {
      position: relative;
      width: 100%;
      padding-top: 56.25%; /* 16:9 Aspect Ratio */
      background-color: #000;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #333;
    }

    .player-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    .subtitle-overlay {
      position: absolute;
      bottom: 10px;
      left: 10px;
      right: 10px;
      background: rgba(0, 0, 0, 0.85);
      color: #ffe600;
      padding: 8px 12px;
      border-radius: 6px;
      text-align: center;
      font-size: 15px;
      font-weight: 600;
      border: 1px solid rgba(255, 230, 0, 0.3);
      z-index: 10;
      pointer-events: none;
    }

    .controls-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    select {
      width: 100%;
      padding: 12px;
      background-color: #0f0f0f;
      border: 1px solid #444;
      border-radius: 8px;
      color: white;
      font-size: 14px;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: #00ff88;
      margin-top: 8px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background-color: #00ff88;
      border-radius: 50%;
    }

    footer {
      text-align: center;
      padding: 16px;
      font-size: 12px;
      color: #666;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">
      ▶ <span>YT Polonizator</span>
    </div>
    <div class="badge-pwa">PWA MOBILE</div>
  </header>

  <main>
    <!-- Sekcja wklejania linku -->
    <div class="card">
      <div class="card-title">1. Wklej link z YouTube</div>
      <div class="input-group">
        <input type="text" id="ytUrl" placeholder="https://www.youtube.com/watch?v=..." value="https://www.youtube.com/watch?v=dQw4w9WgXcQ">
        <div class="controls-grid">
          <button class="btn btn-secondary" onclick="pasteFromClipboard()">📋 Wklej</button>
          <button class="btn btn-primary" onclick="loadVideo()">▶ Odpal z Lektorem</button>
        </div>
      </div>
    </div>

    <!-- Odtwarzacz wideo z nakładką -->
    <div class="player-container" id="playerContainer">
      <iframe id="ytIframe" src="https://www.youtube-nocookie.com/embed/dQw4w9WgXcQ?enablejsapi=1" allow="autoplay; encrypted-media" allowfullscreen></iframe>
      <div class="subtitle-overlay" id="subtitleBox">
        [Polski Agent AI]: Gotowy do tłumaczenia. Kliknij "Odpal z Lektorem".
      </div>
    </div>

    <!-- Ustawienia Lektora -->
    <div class="card">
      <div class="card-title">2. Ustawienia Agenta Tłumaczącego</div>
      <div class="controls-grid">
        <div>
          <label style="font-size:12px; color:#aaa; display:block; margin-bottom:4px;">Styl lektora:</label>
          <select id="styleSelect" onchange="updateStyle()">
            <option value="lektor">Lektor Filmowy (Poważny)</option>
            <option value="luzak">Styl Potoczny (Młodzieżowy)</option>
            <option value="formalny">Dokładny / Formalny</option>
          </select>
        </div>
        <div>
          <label style="font-size:12px; color:#aaa; display:block; margin-bottom:4px;">Głos syntetyzatora:</label>
          <button class="btn btn-secondary" style="padding:10px;" onclick="testVoice()">🔊 Testuj Głos</button>
        </div>
      </div>
      <div class="status-badge">
        <div class="status-dot"></div>
        <span id="statusText">Agent AI gotowy do pracy na telefonie</span>
      </div>
    </div>
  </main>

  <footer>
    Wersja Mobilna (PWA) • Działa na iOS & Android
  </footer>

  <script>
    let synth = window.speechSynthesis;
    let isPlaying = false;
    let timer = null;

    const sampleDialogues = {
      lektor: [
        "Witaj w przetłumaczonym wideo. Agent AI czyta tekst po polsku.",
        "System automatycznie dopasowuje polskie napisy i lektora w czasie rzeczywistym.",
        "Teraz możesz oglądać dowolne zagraniczne filmy na swoim telefonie!"
      ],
      luzak: [
        "Siemanko! Agent AI tłumaczy dla Ciebie ten filmik na żywo.",
        "Koniec ze zgadywaniem, o czym gadają po angielsku na YT.",
        "Oglądaj wygodnie na fonie z polskim lektorem!"
      ],
      formalny: [
        "Szanowni Państwo, rozpoczynamy automatyczną transkrypcję materiału wideo.",
        "Tłumaczenie na język polski realizowane jest przez algorytmy sztucznej inteligencji.",
        "Dziękujemy za korzystanie z aplikacji YT Polonizator Mobile."
      ]
    };

    function extractVideoId(url) {
      const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
      const match = url.match(regExp);
      return (match && match[2].length === 11) ? match[2] : null;
    }

    async function pasteFromClipboard() {
      try {
        const text = await navigator.clipboard.readText();
        if (text) {
          document.getElementById('ytUrl').value = text;
        }
      } catch (err) {
        alert('Wklej link ręcznie do pola tekstowego.');
      }
    }

    function loadVideo() {
      const url = document.getElementById('ytUrl').value;
      const videoId = extractVideoId(url);

      if (!videoId) {
        alert('Podaj poprawny link do filmu na YouTube!');
        return;
      }

      const iframe = document.getElementById('ytIframe');
      iframe.src = `https://www.youtube-nocookie.com/embed/${videoId}?autoplay=1&enablejsapi=1`;

      startTranslationSimulation();
    }

    function startTranslationSimulation() {
      if (timer) clearInterval(timer);
      
      let index = 0;
      const style = document.getElementById('styleSelect').value;
      const lines = sampleDialogues[style] || sampleDialogues.lektor;

      document.getElementById('statusText').innerText = "Tłumaczenie w czasie rzeczywistym...";

      function step() {
        const text = lines[index % lines.length];
        document.getElementById('subtitleBox').innerText = text;
        speakText(text);
        index++;
      }

      step();
      timer = setInterval(step, 5000);
    }

    function speakText(text) {
      if ('speechSynthesis' in window) {
        synth.cancel(); // Przerwij poprzednie
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'pl-PL';
        utterance.rate = 1.0;
        synth.speak(utterance);
      }
    }

    function testVoice() {
      speakText("Cześć! To jest testowy głos polskiego lektora na Twoim telefonie.");
    }

    function updateStyle() {
      if (timer) {
        startTranslationSimulation();
      }
    }
  </script>
</body>
</html>
