<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>YT Polonizator - Fast Sync V9</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { background-color: #0f0f0f; color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; min-height: 100vh; display: flex; flex-direction: column; }
    header { background-color: #1f1f1f; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #333; position: sticky; top: 0; z-index: 100; }
    .logo { display: flex; align-items: center; gap: 8px; font-weight: bold; font-size: 16px; color: #ff0000; }
    .logo span { color: #fff; }
    .badge-pwa { background: #00bcd4; color: #000; font-size: 10px; padding: 2px 6px; border-radius: 4px; font-weight: bold; }
    main { flex: 1; padding: 12px; max-width: 500px; margin: 0 auto; width: 100%; display: flex; flex-direction: column; gap: 12px; }
    .card { background-color: #1f1f1f; border-radius: 12px; padding: 12px; border: 1px solid #333; }
    .card-title { font-size: 12px; color: #aaa; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
    .input-group { display: flex; flex-direction: column; gap: 8px; }
    input[type="text"] { width: 100%; padding: 12px; background-color: #0f0f0f; border: 1px solid #444; border-radius: 8px; color: #fff; font-size: 14px; outline: none; }
    
    .player-container { 
      position: relative; 
      width: 100%; 
      padding-top: 56.25%; 
      background-color: #000; 
      border-radius: 12px; 
      overflow: hidden; 
      border: 1px solid #333; 
    }
    .player-container iframe, .player-container div { 
      position: absolute; 
      top: 0; 
      left: 0; 
      width: 100% !important; 
      height: 100% !important; 
    }
    
    .subtitle-box { 
      background: #111; 
      color: #ff9900; 
      padding: 12px; 
      border-radius: 12px; 
      text-align: center; 
      font-size: 15px; 
      font-weight: bold;
      border: 2px solid #ff9900;
      min-height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1.3;
      box-shadow: 0 0 10px rgba(255,153,0,0.2);
    }

    .controls-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: bold; font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }
    .btn-primary { background-color: #ff0000; color: white; }
    .btn-secondary { background-color: #333; color: white; }
    .btn-speaker { background-color: #ff9900; color: #000; font-size: 15px; }
    .status-badge { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: #aaa; }
    .status-dot { width: 8px; height: 8px; background-color: #ff9900; border-radius: 50%; }
    footer { text-align: center; padding: 12px; font-size: 11px; color: #666; }
  </style>
</head>
<body>

  <header>
    <div class="logo">▶ <span>YT Polonizator</span></div>
    <div class="badge-pwa">FAST SYNC V9</div>
  </header>

  <main>
    <div class="card">
      <div class="card-title">1. Link do filmu</div>
      <div class="input-group">
        <input type="text" id="ytUrl" placeholder="Wklej link YouTube..." value="https://www.youtube.com/watch?v=a0kTvGsdiOQ">
        <div class="controls-grid">
          <button class="btn btn-secondary" onclick="pasteFromClipboard()">📋 Wklej</button>
          <button class="btn btn-primary" onclick="loadVideo()">💬 Załaduj Film</button>
        </div>
      </div>
    </div>

    <div class="player-container">
      <div id="player"></div>
    </div>

    <button class="btn btn-speaker" id="activateBtn" onclick="activateLektor()">🔊 ODBLOKUJ LEKTORA (BEZ ZACIĘĆ)</button>

    <div class="subtitle-box" id="subtitleBox">
      Kliknij przycisk powyżej, a potem włącz film!
    </div>

    <div class="card">
      <div class="card-title">2. Status Lektora</div>
      <div class="status-badge">
        <div class="status-dot" id="statusDot"></div>
        <span id="statusText">System oczekuje</span>
      </div>
    </div>
  </main>

  <footer>YT Polonizator - Stream Audio Engine</footer>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    let player;
    let syncInterval = null;
    let lastSpokenIndex = -1;
    let audioElem = new Audio();

    const mockSubtitles = [
      { start: 2.0, end: 5.0, text: "Cześć! Opowiedzieć Ci o nowym lokatorze?" },
      { start: 6.0, end: 9.0, text: "Oto Hector z Argentyny!" },
      { start: 10.0, end: 14.0, text: "Cześć wszystkim, bardzo mi miło Was poznać." },
      { start: 15.0, end: 18.0, text: "Chodź, pokażę Ci Twój pokój." },
      { start: 19.0, end: 23.0, text: "Tutaj jest łazienka i kuchnia." },
      { start: 24.0, end: 28.0, text: "Dziękuję bardzo, mieszkanie jest wspaniałe." },
      { start: 29.0, end: 34.0, text: "Napijesz się z nami herbaty?" },
      { start: 35.0, end: 40.0, text: "Bardzo chętnie, dziękuję!" }
    ];

    function activateLektor() {
      // Inicjalizacja strumienia audio
      audioElem.src = "data:audio/wav;base64,UklGRigAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=";
      audioElem.play().then(() => {
        document.getElementById('activateBtn').style.backgroundColor = "#4CAF50";
        document.getElementById('activateBtn').innerText = "✅ LEKTOR AKTYWNY";
        document.getElementById('subtitleBox').innerText = "Gotowe! Uruchom wideo.";
        document.getElementById('statusText').innerText = "Strumień aktywny";
      }).catch(e => console.log(e));
    }

    function speakText(text) {
      if (!text) return;

      // Zastępujemy SpeechSynthesis bezpośrednim strumieniem audio (Google TTS API)
      let url = "https://translate.google.com/translate_tts?ie=UTF-8&q=" + encodeURIComponent(text) + "&tl=pl&client=tw-ob";
      
      audioElem.src = url;
      audioElem.play().catch(err => console.log("Audio play err:", err));
    }

    function startSubtitleSync() {
      if (syncInterval) clearInterval(syncInterval);
      
      // Bardzo szybka pętla synchronizacji (50ms) dla natychmiastowej reakcji
      syncInterval = setInterval(() => {
        if (!player || typeof player.getCurrentTime !== 'function') return;
        
        let currentTime = player.getCurrentTime();
        let state = player.getPlayerState();

        if (state === YT.PlayerState.PLAYING) {
          let currentSubIndex = mockSubtitles.findIndex(s => currentTime >= s.start && currentTime <= s.end);
          
          if (currentSubIndex !== -1 && currentSubIndex !== lastSpokenIndex) {
            lastSpokenIndex = currentSubIndex;
            let sub = mockSubtitles[currentSubIndex];
            
            document.getElementById('subtitleBox').innerText = sub.text;
            document.getElementById('statusText').innerText = "Czytam: " + sub.text;
            speakText(sub.text);
          }
        }
      }, 50);
    }

    function onYouTubeIframeAPIReady() {
      initPlayer('a0kTvGsdiOQ');
    }

    function initPlayer(videoId) {
      if (player && typeof player.loadVideoById === 'function') {
        player.loadVideoById({ videoId: videoId });
      } else {
        player = new YT.Player('player', {
          videoId: videoId,
          playerVars: { 'autoplay': 0, 'playsinline': 1 },
          events: {
            'onReady': onPlayerReady,
            'onStateChange': onPlayerStateChange
          }
        });
      }
    }

    function onPlayerReady() {
      document.getElementById('statusText').innerText = "Film załadowany";
    }

    function onPlayerStateChange(event) {
      if (event.data === YT.PlayerState.PLAYING) {
        startSubtitleSync();
      }
    }

    function extractVideoId(rawInput) {
      if (!rawInput) return null;
      let clean = rawInput.replace(/[\[\]\s]/g, '');
      const reg = /(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?)\/|.*[?&]v=)|youtu\.be\/)([^"&?\/\s]{11})/;
      const match = clean.match(reg);
      return match ? match[1] : null;
    }

    async function pasteFromClipboard() {
      try {
        const text = await navigator.clipboard.readText();
        if (text) document.getElementById('ytUrl').value = text;
      } catch (err) {
        alert('Wklej link ręcznie.');
      }
    }

    function loadVideo() {
      const rawUrl = document.getElementById('ytUrl').value;
      const videoId = extractVideoId(rawUrl);

      if (!videoId) {
        alert('Niepoprawny link YouTube!');
        return;
      }

      lastSpokenIndex = -1;
      document.getElementById('statusText').innerText = "Ładowanie...";
      initPlayer(videoId);
    }
  </script>
</body>
</html>
