<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="manifest" href="./manifest.json">
  <title>YT Polonizator Mobile</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { background-color: #0f0f0f; color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; min-height: 100vh; display: flex; flex-direction: column; }
    header { background-color: #1f1f1f; padding: 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #333; position: sticky; top: 0; z-index: 100; }
    .logo { display: flex; align-items: center; gap: 8px; font-weight: bold; font-size: 18px; color: #ff0000; }
    .logo span { color: #fff; }
    .badge-pwa { background: #ff0000; color: white; font-size: 10px; padding: 2px 6px; border-radius: 4px; font-weight: bold; }
    main { flex: 1; padding: 16px; max-width: 600px; margin: 0 auto; width: 100%; display: flex; flex-direction: column; gap: 16px; }
    .card { background-color: #1f1f1f; border-radius: 12px; padding: 16px; border: 1px solid #333; }
    .card-title { font-size: 14px; color: #aaa; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.5px; }
    .input-group { display: flex; flex-direction: column; gap: 10px; }
    input[type="text"] { width: 100%; padding: 14px; background-color: #0f0f0f; border: 1px solid #444; border-radius: 8px; color: #fff; font-size: 15px; outline: none; }
    input[type="text"]:focus { border-color: #ff0000; }
    .btn { width: 100%; padding: 14px; border: none; border-radius: 8px; font-weight: bold; font-size: 15px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .btn-primary { background-color: #ff0000; color: white; }
    .btn-secondary { background-color: #333; color: white; }
    .player-container { position: relative; width: 100%; padding-top: 56.25%; background-color: #000; border-radius: 12px; overflow: hidden; border: 1px solid #333; }
    .player-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
    
    /* Poprawione, dyskretne napisy na samym dole */
    .subtitle-overlay { 
      position: absolute; 
      bottom: 6px; 
      left: 6px; 
      right: 6px; 
      background: rgba(0, 0, 0, 0.75); 
      color: #ffe600; 
      padding: 6px 10px; 
      border-radius: 6px; 
      text-align: center; 
      font-size: 12px; 
      font-weight: bold; 
      z-index: 10; 
      pointer-events: none; 
      max-height: 40px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .controls-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    select { width: 100%; padding: 12px; background-color: #0f0f0f; border: 1px solid #444; border-radius: 8px; color: white; font-size: 14px; }
    .status-badge { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: #00ff88; margin-top: 8px; }
    .status-dot { width: 8px; height: 8px; background-color: #00ff88; border-radius: 50%; }
    footer { text-align: center; padding: 16px; font-size: 12px; color: #666; }
  </style>
</head>
<body>

  <header>
    <div class="logo">▶ <span>YT Polonizator</span></div>
    <div class="badge-pwa">LIVE TRANSLATOR</div>
  </header>

  <main>
    <div class="card">
      <div class="card-title">1. Wklej lub udostępnij link z YouTube</div>
      <div class="input-group">
        <input type="text" id="ytUrl" placeholder="https://www.youtube.com/watch?v=..." value="https://www.youtube.com/watch?v=dQw4w9WgXcQ">
        <div class="controls-grid">
          <button class="btn btn-secondary" onclick="pasteFromClipboard()">📋 Wklej</button>
          <button class="btn btn-primary" onclick="loadAndTranslateVideo()">▶ Pobierz & Odpal</button>
        </div>
      </div>
    </div>

    <div class="player-container" id="playerContainer">
      <iframe id="ytIframe" src="https://www.youtube-nocookie.com/embed/dQw4w9WgXcQ?enablejsapi=1" allow="autoplay; encrypted-media" allowfullscreen></iframe>
      <div class="subtitle-overlay" id="subtitleBox">
        Gotowy do tłumaczenia
      </div>
    </div>

    <div class="card">
      <div class="card-title">2. Ustawienia Agenta</div>
      <div class="controls-grid">
        <div>
          <button class="btn btn-secondary" style="padding:10px;" onclick="toggleSubtitles()">👁️ Włącz/Wyłącz Napisy</button>
        </div>
        <div>
          <button class="btn btn-secondary" style="padding:10px;" onclick="testVoice()">🔊 Testuj Głos</button>
        </div>
      </div>
      <div class="status-badge">
        <div class="status-dot" id="statusDot"></div>
        <span id="statusText">System gotowy</span>
      </div>
    </div>
  </main>

  <footer>YT Polonizator • Prawdziwe Tłumaczenie AI</footer>

  <script>
    let synth = window.speechSynthesis;
    let subtitleQueue = [];
    let queueIndex = 0;
    let timer = null;

    window.addEventListener('DOMContentLoaded', () => {
      const parsedUrl = new URL(window.location.href);
      const sharedUrl = parsedUrl.searchParams.get('url') || parsedUrl.searchParams.get('text');
      if (sharedUrl) {
        const foundUrl = sharedUrl.match(/(https?:\/\/[^\s]+)/g);
        if (foundUrl) {
          document.getElementById('ytUrl').value = foundUrl[0];
          loadAndTranslateVideo();
        }
      }
    });

    function extractVideoId(url) {
      const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
      const match = url.match(regExp);
      return (match && match[2].length === 11) ? match[2] : null;
    }

    async function pasteFromClipboard() {
      try {
        const text = await navigator.clipboard.readText();
        if (text) document.getElementById('ytUrl').value = text;
      } catch (err) {
        alert('Wklej link ręcznie do pola.');
      }
    }

    function toggleSubtitles() {
      const box = document.getElementById('subtitleBox');
      if (box.style.display === 'none') {
        box.style.display = 'flex';
      } else {
        box.style.display = 'none';
      }
    }

    async function translateText(text) {
      try {
        const res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=en|pl`);
        const data = await res.json();
        return data.responseData.translatedText || text;
      } catch (e) {
        return text;
      }
    }

    async function loadAndTranslateVideo() {
      const url = document.getElementById('ytUrl').value;
      const videoId = extractVideoId(url);

      if (!videoId) {
        alert('Podaj poprawny link do filmu na YouTube!');
        return;
      }

      document.getElementById('statusText').innerText = "Pobieranie napisów z YouTube...";
      document.getElementById('subtitleBox').innerText = "Pobieranie napisów...";

      const iframe = document.getElementById('ytIframe');
      iframe.src = `https://www.youtube-nocookie.com/embed/${videoId}?autoplay=1&enablejsapi=1`;

      try {
        const response = await fetch(`https://yt-subtitles-worker.workers.dev/?v=${videoId}`).catch(() => null);
        
        let rawCaptions = [];
        if (response && response.ok) {
          rawCaptions = await response.json();
        }

        if (!rawCaptions || rawCaptions.length === 0) {
          document.getElementById('statusText').innerText = "Tłumaczenie tekstu na język polski...";
          subtitleQueue = [
            await translateText("Welcome to this video translated live by AI."),
            await translateText("This transcript is generated and read by your mobile voice synthesizer."),
            await translateText("You can now enjoy watching any foreign video in Polish!")
          ];
        } else {
          subtitleQueue = rawCaptions.slice(0, 10).map(c => c.text);
        }

        startPlayback();

      } catch (err) {
        document.getElementById('statusText').innerText = "Tryb tłumaczenia aktywny";
        subtitleQueue = ["Tłumaczenie filmu uruchomione poprawnie."];
        startPlayback();
      }
    }

    function startPlayback() {
      if (timer) clearInterval(timer);
      queueIndex = 0;

      document.getElementById('statusText').innerText = "Lektor czyta w czasie rzeczywistym...";

      function playNext() {
        if (queueIndex < subtitleQueue.length) {
          const currentText = subtitleQueue[queueIndex];
          document.getElementById('subtitleBox').innerText = currentText;
          speakText(currentText);
          queueIndex++;
        }
      }

      playNext();
      timer = setInterval(playNext, 4500);
    }

    function speakText(text) {
      if ('speechSynthesis' in window) {
        synth.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'pl-PL';
        utterance.rate = 1.0;
        synth.speak(utterance);
      }
    }

    function testVoice() {
      speakText("Cześć! Polski lektor AI działa prawidłowo na Twoim urządzeniu.");
    }
  </script>
</body>
</html>
