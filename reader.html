<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YT Polonizator</title>
  <style>
    * { box-sizing: border-box; }
    body { background: #121212; color: #fff; font-family: -apple-system, BlinkMacSystemFont, sans-serif; margin: 0; padding: 16px; display: flex; flex-direction: column; align-items: center; }
    header { display: flex; justify-content: space-between; align-items: center; width: 100%; max-width: 500px; margin-bottom: 16px; }
    .logo { display: flex; align-items: center; gap: 8px; font-weight: bold; font-size: 18px; color: #ff0000; }
    .logo span { color: #fff; }
    .badge-pwa { background: #4CAF50; color: #fff; font-size: 10px; font-weight: bold; padding: 4px 8px; border-radius: 4px; }
    main { flex: 1; padding: 0; max-width: 500px; width: 100%; }
    .card { background-color: #1f1f1f; border-radius: 12px; padding: 16px; margin-bottom: 16px; }
    .card-title { font-size: 12px; color: #aaa; margin-bottom: 8px; font-weight: bold; text-transform: uppercase; }
    .input-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 8px; }
    input[type="text"] { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #333; background-color: #000; color: #fff; font-size: 14px; }
    .btn-group { display: flex; gap: 8px; }
    .btn { flex: 1; padding: 12px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 6px; font-size: 14px; }
    .btn-paste { background-color: #333; color: #fff; }
    .btn-load { background-color: #ff0000; color: #fff; }
    .btn-activate { width: 100%; background-color: #4CAF50; color: #fff; padding: 14px; font-size: 14px; margin-bottom: 16px; border-radius: 8px; border: none; font-weight: bold; }
    .player-container { position: relative; width: 100%; padding-bottom: 56.25%; height: 0; background-color: #000; border-radius: 12px; overflow: hidden; margin-bottom: 16px; }
    .player-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
    .subtitle-box { background-color: #1a1a1a; border: 1px solid #ff9800; border-radius: 12px; padding: 16px; min-height: 80px; text-align: center; color: #ff9800; font-weight: bold; display: flex; align-items: center; justify-content: center; font-size: 15px; }
  </style>
</head>
<body>

  <header>
    <div class="logo">► <span>YT Polonizator</span></div>
    <div class="badge-pwa">HYBRID V23</div>
  </header>

  <main>
    <div class="card">
      <div class="card-title">1. Link do filmu</div>
      <div class="input-group">
        <input type="text" id="videoUrl" placeholder="Wklej link z YouTube...">
        <div class="btn-group">
          <button class="btn btn-paste" onclick="pasteFromClipboard()">📋 Wklej</button>
          <button class="btn btn-load" onclick="loadVideo()">💬 Załaduj Film</button>
        </div>
      </div>
    </div>

    <div class="player-container">
      <div id="player"></div>
    </div>

    <button id="activateBtn" class="btn-activate" onclick="activateLektorDirect()">🔊 TŁUMACZENIE AKTYWNE</button>

    <div id="subtitleBox" class="subtitle-box">
      Wklej link do filmu i kliknij "Załaduj Film".
    </div>
  </main>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    let player = null;
    let syncInterval = null;
    let lastSpokenIndex = -1;
    let fetchedSubtitles = [];
    const translationCache = {};

    function onYouTubeIframeAPIReady() {}

    function activateLektorDirect() {
      const btn = document.getElementById('activateBtn');
      btn.style.backgroundColor = "#2E7D32";
      btn.style.color = "#ffffff";
      btn.innerText = "✅ TŁUMACZENIE AKTYWNE";
    }

    function extractVideoId(url) {
      if (!url) return null;
      const cleanUrl = url.trim();
      const regExp = /(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?)\/|.*[?&]v=)|youtu\.be\/)([^"&?\/\s]{11})/;
      const match = cleanUrl.match(regExp);
      if (match && match[1]) return match[1];
      if (cleanUrl.length === 11 && !cleanUrl.includes('/')) return cleanUrl;
      return null;
    }

    async function pasteFromClipboard() {
      try {
        const text = await navigator.clipboard.readText();
        document.getElementById('videoUrl').value = text;
      } catch (err) {
        alert("Wklej link ręcznie.");
      }
    }

    function loadVideo() {
      const urlInput = document.getElementById('videoUrl').value;
      const videoId = extractVideoId(urlInput);

      if (!videoId) {
        alert("Niepoprawny link z YouTube!");
        return;
      }

      if (player && typeof player.loadVideoById === 'function') {
        player.loadVideoById(videoId);
      } else {
        player = new YT.Player('player', {
          height: '100%',
          width: '100%',
          videoId: videoId,
          events: {
            'onStateChange': onPlayerStateChange
          }
        });
      }

      fetchSubtitlesDirect(videoId);
    }

    async function translateTextFast(text) {
      if (translationCache[text]) return translationCache[text];
      try {
        const res = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=pl&dt=t&q=${encodeURIComponent(text)}`);
        const data = await res.json();
        if (data && data[0] && data[0][0] && data[0][0][0]) {
          const translated = data[0][0][0];
          translationCache[text] = translated;
          return translated;
        }
      } catch (e) {
        console.error(e);
      }
      return text;
    }

    async function fetchSubtitlesDirect(videoId) {
      const box = document.getElementById('subtitleBox');
      box.innerText = "Pobieranie napisów...";
      fetchedSubtitles = [];
      lastSpokenIndex = -1;

      // Sprawdzanie dostępnych języków bezpośrednio z API YouTube TimedText
      const langs = ['en', 'pl', 'de', 'es', 'fr', 'a.en', 'a.pl'];
      let xmlText = null;

      for (let lang of langs) {
        try {
          const isAuto = lang.startsWith('a.');
          const cleanLang = lang.replace('a.', '');
          let url = `https://www.youtube.com/api/timedtext?v=${videoId}&lang=${cleanLang}`;
          if (isAuto) url += `&kind=asr`;

          const res = await fetch(url);
          if (res.ok) {
            const text = await res.text();
            if (text && text.includes('<text')) {
              xmlText = text;
              break;
            }
          }
        } catch (e) {}
      }

      if (!xmlText) {
        box.innerText = "Brak pobranych napisów dla tego filmu.";
        return;
      }

      try {
        const parser = new DOMParser();
        const xmlDoc = parser.parseFromString(xmlText, "text/xml");
        const textNodes = xmlDoc.getElementsByTagName("text");

        const parsedSubtitles = [];
        for (let i = 0; i < textNodes.length; i++) {
          const node = textNodes[i];
          const start = parseFloat(node.getAttribute("start") || "0");
          const dur = parseFloat(node.getAttribute("dur") || "3");
          const text = node.textContent
            .replace(/&#39;/g, "'")
            .replace(/&quot;/g, '"')
            .replace(/&amp;/g, '&')
            .replace(/\n/g, ' ')
            .trim();

          if (text) {
            parsedSubtitles.push({ start, dur, text });
          }
        }

        if (parsedSubtitles.length > 0) {
          fetchedSubtitles = parsedSubtitles;
          box.innerText = "Napisy gotowe! Odtwórz film.";
        } else {
          box.innerText = "Puste napisy dla tego filmu.";
        }
      } catch (err) {
        console.error(err);
        box.innerText = "Błąd przetwarzania napisów.";
      }
    }

    function onPlayerStateChange(event) {
      if (event.data === YT.PlayerState.PLAYING) {
        startSync();
      } else {
        stopSync();
      }
    }

    function startSync() {
      if (syncInterval) clearInterval(syncInterval);
      syncInterval = setInterval(checkSubtitles, 150);
    }

    function stopSync() {
      if (syncInterval) clearInterval(syncInterval);
    }

    async function checkSubtitles() {
      if (!player || typeof player.getCurrentTime !== 'function' || fetchedSubtitles.length === 0) return;

      const currentTime = player.getCurrentTime();

      for (let i = 0; i < fetchedSubtitles.length; i++) {
        const sub = fetchedSubtitles[i];
        if (currentTime >= sub.start && currentTime <= (sub.start + sub.dur)) {
          if (lastSpokenIndex !== i) {
            lastSpokenIndex = i;
            const polishText = await translateTextFast(sub.text);
            document.getElementById('subtitleBox').innerText = polishText;
          }
          break;
        }
      }
    }
  </script>
</body>
</html>
