<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>YT Polonizator - Direct Captions V15</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { background-color: #0f0f0f; color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; min-height: 100vh; display: flex; flex-direction: column; }
    header { background-color: #1f1f1f; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #333; position: sticky; top: 0; z-index: 100; }
    .logo { display: flex; align-items: center; gap: 8px; font-weight: bold; font-size: 16px; color: #ff0000; }
    .logo span { color: #fff; }
    .badge-pwa { background: #9c27b0; color: #fff; font-size: 10px; padding: 2px 6px; border-radius: 4px; font-weight: bold; }
    main { flex: 1; padding: 12px; max-width: 500px; margin: 0 auto; width: 100%; display: flex; flex-direction: column; gap: 12px; }
    .card { background-color: #1f1f1f; border-radius: 12px; padding: 12px; border: 1px solid #333; }
    .card-title { font-size: 12px; color: #aaa; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
    .input-group { display: flex; flex-direction: column; gap: 8px; }
    input[type="text"] { width: 100%; padding: 12px; background-color: #0f0f0f; border: 1px solid #444; border-radius: 8px; color: #fff; font-size: 14px; outline: none; }
    
    .player-container { 
      position: relative; 
      width: 100%; 
      padding-top: 56.25%; 
      background-color: #000; 
      border-radius: 12px; 
      overflow: hidden; 
      border: 1px solid #333; 
    }
    .player-container iframe, .player-container div { 
      position: absolute; 
      top: 0; 
      left: 0; 
      width: 100% !important; 
      height: 100% !important; 
    }
    
    .subtitle-box { 
      background: #111; 
      color: #ff9900; 
      padding: 12px; 
      border-radius: 12px; 
      text-align: center; 
      font-size: 15px; 
      font-weight: bold;
      border: 2px solid #ff9900;
      min-height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1.3;
      box-shadow: 0 0 10px rgba(255,153,0,0.2);
    }

    .controls-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: bold; font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }
    .btn-primary { background-color: #ff0000; color: white; }
    .btn-secondary { background-color: #333; color: white; }
    .btn-ai { background-color: #9c27b0; color: white; }
    footer { text-align: center; padding: 12px; font-size: 11px; color: #666; }
  </style>
</head>
<body>

  <header>
    <div class="logo">▶ <span>YT Polonizator</span></div>
    <div class="badge-pwa">DIRECT CAPTIONS V15</div>
  </header>

  <main>
    <div class="card">
      <div class="card-title">1. Link do filmu</div>
      <div class="input-group">
        <input type="text" id="ytUrl" placeholder="Wklej link YouTube..." value="https://www.youtube.com/watch?v=a0kTvGsdiOQ">
        <div class="controls-grid">
          <button class="btn btn-secondary" onclick="pasteFromClipboard()">📋 Wklej</button>
          <button class="btn btn-primary" onclick="loadVideo()">💬 Załaduj Film</button>
        </div>
      </div>
    </div>

    <div class="player-container">
      <div id="player"></div>
    </div>

    <button class="btn btn-ai" id="activateBtn" onclick="activateLektorDirect()">🔊 AKTYWUJ LEKTORA</button>

    <div class="subtitle-box" id="subtitleBox">
      Załaduj film, aby pobrać napisów z YouTube.
    </div>
  </main>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    let player;
    let syncInterval = null;
    let lastSpokenIndex = -1;
    let isActivated = false;
    let fetchedSubtitles = [];

    function activateLektorDirect() {
      isActivated = true;
      const btn = document.getElementById('activateBtn');
      btn.style.backgroundColor = "#4CAF50";
      btn.style.color = "#ffffff";
      btn.innerText = "✅ LEKTOR AKTYWNY";

      if ('speechSynthesis' in window) {
        window.speechSynthesis.resume();
        let u = new SpeechSynthesisUtterance("");
        u.lang = 'pl-PL';
        window.speechSynthesis.speak(u);
      }
    }

    async function fetchRealSubtitles(videoId) {
      document.getElementById('subtitleBox').innerText = "Szukanie napisów dla filmu...";
      fetchedSubtitles = [];
      lastSpokenIndex = -1;

      const instances = [
        `https://pipedapi.kavin.rocks/streams/${videoId}`,
        `https://api.piped.privacydev.net/streams/${videoId}`
      ];

      let loaded = false;

      for (let url of instances) {
        try {
          const res = await fetch(url);
          const data = await res.json();

          if (data && data.subtitles && data.subtitles.length > 0) {
            // Szukamy polskich napisów lub automatycznie wygenerowanych
            let subTrack = data.subtitles.find(s => s.lang === 'pl' || s.code === 'pl') || data.subtitles[0];

            if (subTrack && subTrack.url) {
              const subRes = await fetch(subTrack.url);
              const subText = await subRes.text();
              parseSrtOrVtt(subText);
              loaded = true;
              break;
            }
          }
        } catch (e) {
          console.log("Próba pobrania napisów z instancji nie powiodła się:", url);
        }
      }

      if (!loaded) {
        document.getElementById('subtitleBox').innerText = "Ten film nie zawiera publicznie dostępnych napisów.";
      }
    }

    function parseSrtOrVtt(content) {
      fetchedSubtitles = [];
      const lines = content.split('\n');
      let currentItem = null;

      const timeRegex = /(\d{2}):(\d{2}):(\d{2})[\.,](\d{3})\s*-->\s*(\d{2}):(\d{2}):(\d{2})[\.,](\d{3})/;

      for (let line of lines) {
        line = line.trim();
        let match = line.match(timeRegex);

        if (match) {
          if (currentItem && currentItem.text) {
            fetchedSubtitles.push(currentItem);
          }
          let startSec = parseInt(match[1])*3600 + parseInt(match[2])*60 + parseInt(match[3]) + parseInt(match[4])/1000;
          let endSec = parseInt(match[5])*3600 + parseInt(match[6])*60 + parseInt(match[7]) + parseInt(match[8])/1000;
          currentItem = { start: startSec, end: endSec, text: "" };
        } else if (currentItem && line && !line.startsWith('WEBVTT') && !/^\d+$/.test(line)) {
          currentItem.text += (currentItem.text ? " " : "") + line.replace(/<[^>]*>/g, '');
        }
      }

      if (currentItem && currentItem.text) {
        fetchedSubtitles.push(currentItem);
      }

      if (fetchedSubtitles.length > 0) {
        document.getElementById('subtitleBox').innerText = `Pobrano ${fetchedSubtitles.length} linii napisów! Odpal film.`;
      } else {
        document.getElementById('subtitleBox').innerText = "Brak czytelnych napisów w pliku transkrypcji.";
      }
    }

    function speakText(text) {
      if (!isActivated || !text || !('speechSynthesis' in window)) return;

      window.speechSynthesis.cancel();

      let utter = new SpeechSynthesisUtterance(text);
      utter.lang = 'pl-PL';
      utter.rate = 1.15;

      window.speechSynthesis.speak(utter);
    }

    function startSubtitleSync() {
      if (syncInterval) clearInterval(syncInterval);
      
      syncInterval = setInterval(() => {
        if (!player || typeof player.getCurrentTime !== 'function' || fetchedSubtitles.length === 0) return;
        
        let currentTime = player.getCurrentTime();
        let state = player.getPlayerState();

        if (state === YT.PlayerState.PLAYING) {
          let currentSubIndex = fetchedSubtitles.findIndex(s => currentTime >= s.start && currentTime <= s.end);
          
          if (currentSubIndex !== -1 && currentSubIndex !== lastSpokenIndex) {
            lastSpokenIndex = currentSubIndex;
            let sub = fetchedSubtitles[currentSubIndex];
            
            document.getElementById('subtitleBox').innerText = sub.text;
            speakText(sub.text);
          }
        }
      }, 100);
    }

    function onYouTubeIframeAPIReady() {
      initPlayer('a0kTvGsdiOQ');
    }

    function initPlayer(videoId) {
      if (player && typeof player.loadVideoById === 'function') {
        player.loadVideoById({ videoId: videoId });
      } else {
        player = new YT.Player('player', {
          videoId: videoId,
          playerVars: { 'autoplay': 0, 'playsinline': 1 },
          events: {
            'onStateChange': onPlayerStateChange
          }
        });
      }
      fetchRealSubtitles(videoId);
    }

    function onPlayerStateChange(event) {
      if (event.data === YT.PlayerState.PLAYING) {
        startSubtitleSync();
      }
    }

    function extractVideoId(rawInput) {
      if (!rawInput) return null;
      let clean = rawInput.replace(/[\[\]\s]/g, '');
      const reg = /(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?)\/|.*[?&]v=)|youtu\.be\/)([^"&?\/\s]{11})/;
      const match = clean.match(reg);
      return match ? match[1] : null;
    }

    async function pasteFromClipboard() {
      try {
        const text = await navigator.clipboard.readText();
        if (text) document.getElementById('ytUrl').value = text;
      } catch (err) {
        alert('Wklej link ręcznie.');
      }
    }

    function loadVideo() {
      const rawUrl = document.getElementById('ytUrl').value;
      const videoId = extractVideoId(rawUrl);

      if (!videoId) {
        alert('Niepoprawny link YouTube!');
        return;
      }

      initPlayer(videoId);
    }
  </script>
</body>
</html>
