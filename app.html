<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YT Polonizator</title>
    <style>
        body { background: #121212; color: #fff; font-family: sans-serif; margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 600px; display: flex; flex-direction: column; gap: 10px; }
        .input-group { display: flex; gap: 5px; }
        input { flex: 1; padding: 10px; border-radius: 5px; border: 1px solid #444; background: #222; color: #fff; }
        button { padding: 10px 15px; border-radius: 5px; border: none; background: #e50914; color: #fff; font-weight: bold; cursor: pointer; }
        .player-container { position: relative; width: 100%; padding-bottom: 56.25%; height: 0; background: #000; }
        .player-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
        #status { padding: 10px; text-align: center; font-weight: bold; border-radius: 5px; background: #333; }
        #subtitle-box { padding: 20px; background: #1e1e1e; border-radius: 5px; min-height: 80px; text-align: center; font-size: 22px; font-weight: bold; color: #ffcc00; border: 1px solid #444; }
    </style>
</head>
<body>
    <div class="container">
        <h2>yt-polonizator</h2>
        <div class="input-group">
            <input type="text" id="url-input" placeholder="Wklej link do YouTube...">
            <button onclick="loadVideo()">Załaduj</button>
        </div>
        <div class="player-container">
            <div id="player"></div>
        </div>
        <div id="status">Status: Oczekiwanie na film</div>
        <div id="subtitle-box">Tutaj pojawią się przetłumaczone napisy...</div>
    </div>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        const VERCEL_API_URL = "https://yt-polonizator-backend.vercel.app/api/captions";
        let player;
        let subtitles = [];
        let timeInterval;

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                height: '315',
                width: '560',
                videoId: '',
                events: { 'onStateChange': onPlayerStateChange }
            });
        }

        function extractVideoId(url) {
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        }

        async function loadVideo() {
            const url = document.getElementById('url-input').value;
            const videoId = extractVideoId(url);
            if (!videoId) {
                alert('Nieprawidłowy link do YouTube!');
                return;
            }

            if (player && player.loadVideoById) {
                player.loadVideoById(videoId);
            }

            document.getElementById('status').innerText = 'Pobieranie napisów...';
            
            try {
                const res = await fetch(`${VERCEL_API_URL}?videoId=${videoId}`);
                if (!res.ok) throw new Error('Brak napisów na serwerze');
                
                const xmlText = await res.text();
                parseSubtitles(xmlText);
                document.getElementById('status').innerText = 'Status: Napisy aktywne i gotowe!';
                document.getElementById('status').style.background = '#2e7d32';
            } catch (err) {
                document.getElementById('status').innerText = 'Błąd: ' + err.message;
                document.getElementById('status').style.background = '#c62828';
            }
        }

        function parseSubtitles(xml) {
            subtitles = [];
            const parser = new DOMParser();
            const xmlDoc = parser.parseFromString(xml, "text/xml");
            const textNodes = xmlDoc.getElementsByTagName("text");

            for (let node of textNodes) {
                const start = parseFloat(node.getAttribute("start"));
                const dur = parseFloat(node.getAttribute("dur")) || 3;
                let text = node.textContent || "";
                text = text.replace(/&#39;/g, "'").replace(/&amp;/g, "&").replace(/&quot;/g, '"');
                subtitles.push({ start, end: start + dur, text });
            }
        }

        function onPlayerStateChange(event) {
            if (event.data === YT.PlayerState.PLAYING) {
                if (timeInterval) clearInterval(timeInterval);
                timeInterval = setInterval(updateSubtitles, 250);
            } else {
                if (timeInterval) clearInterval(timeInterval);
            }
        }

        function updateSubtitles() {
            if (!player || !player.getCurrentTime) return;
            const currentTime = player.getCurrentTime();
            
            const currentSub = subtitles.find(s => currentTime >= s.start && currentTime <= s.end);
            const box = document.getElementById('subtitle-box');
            
            if (currentSub) {
                box.innerText = currentSub.text;
            }
        }
    </script>
</body>
</html>
