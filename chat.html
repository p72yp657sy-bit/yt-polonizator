<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YT Polonizator</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            background: #0f0f0f; 
            color: #fff; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            margin: 0; 
            padding: 15px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
        }
        .container { width: 100%; max-width: 600px; display: flex; flex-direction: column; gap: 12px; }
        
        /* Profesjonalny nagłówek */
        .brand-header {
            text-align: center;
            padding: 15px 0 5px 0;
        }
        .brand-title {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0;
            text-shadow: 0 2px 10px rgba(255, 65, 108, 0.2);
        }
        .brand-subtitle {
            font-size: 13px;
            color: #888;
            margin-top: 4px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .input-group { display: flex; gap: 8px; }
        input { 
            flex: 1; 
            padding: 12px 15px; 
            border-radius: 8px; 
            border: 1px solid #333; 
            background: #1a1a1a; 
            color: #fff; 
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus { border-color: #ff416c; }
        
        button { 
            padding: 12px 20px; 
            border-radius: 8px; 
            border: none; 
            background: linear-gradient(135deg, #ff416c, #ff4b2b); 
            color: #fff; 
            font-weight: bold; 
            font-size: 15px;
            cursor: pointer; 
            transition: opacity 0.2s;
        }
        button:active { opacity: 0.8; }

        .player-container { position: relative; width: 100%; padding-bottom: 56.25%; height: 0; background: #000; border-radius: 10px; overflow: hidden; border: 1px solid #222; }
        .player-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
        
        #status { 
            padding: 10px; 
            text-align: center; 
            font-weight: 600; 
            font-size: 14px;
            border-radius: 8px; 
            background: #1a1a1a; 
            border: 1px solid #333;
        }
        
        #subtitle-box { 
            padding: 20px; 
            background: #181818; 
            border-radius: 10px; 
            min-height: 90px; 
            text-align: center; 
            font-size: 22px; 
            font-weight: bold; 
            color: #ffcc00; 
            border: 1px solid #333; 
            display: flex; 
            align-items: center; 
            justify-content: center;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.5);
        }
        
        .nav-link { text-align: center; margin-top: 5px; font-size: 13px; }
        .nav-link a { color: #888; text-decoration: none; transition: color 0.2s; }
        .nav-link a:hover { color: #fff; }
    </style>
</head>
<body>
    <div class="container">
        <!-- Profesjonalne logo -->
        <div class="brand-header">
            <h1 class="brand-title">YT POLONIZATOR</h1>
            <div class="brand-subtitle">Inteligentny tłumacz napisów</div>
        </div>
        
        <!-- Wyszukiwarka / Asystent tytułów -->
        <div class="input-group">
            <input type="text" id="search-input" placeholder="Wpisz tytuł utworu (np. Miley Cyrus Climb)...">
            <button onclick="searchAndPlay()">Szukaj</button>
        </div>

        <!-- Klasyczne pole linku (zostawione dla wygody) -->
        <div class="input-group">
            <input type="text" id="url-input" placeholder="Lub wklej bezpośredni link YouTube...">
            <button onclick="loadVideoFromInput()" style="background: #333;">Załaduj</button>
        </div>

        <div class="player-container">
            <div id="player"></div>
        </div>
        
        <div id="status">Status: Oczekiwanie na utwór</div>
        <div id="subtitle-box">Tutaj pojawią się przetłumaczone napisy...</div>

        <div class="nav-link">
            <a href="reader.html">← Przełącz na wersję klasyczną</a>
        </div>
    </div>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        const VERCEL_API_URL = "https://yt-polonizator-backend.vercel.app/api/captions";
        let player;
        let subtitles = [];
        let timeInterval;

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                height: '315',
                width: '560',
                videoId: '',
                events: { 'onStateChange': onPlayerStateChange }
            });
        }

        function extractVideoId(url) {
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        }

        async function loadVideo(videoId) {
            if (!videoId) return;

            if (player && player.loadVideoById) {
                player.loadVideoById(videoId);
            }

            document.getElementById('status').innerText = 'Pobieranie napisów z serwera...';
            document.getElementById('status').style.background = '#1a1a1a';
            
            try {
                const res = await fetch(`${VERCEL_API_URL}?videoId=${videoId}`);
                if (!res.ok) throw new Error('Brak napisów na serwerze');
                
                const xmlText = await res.text();
                parseSubtitles(xmlText);
                document.getElementById('status').innerText = 'Status: Napisy aktywne i gotowe!';
                document.getElementById('status').style.background = '#1b3b22';
            } catch (err) {
                document.getElementById('status').innerText = 'Informacja: Ten utwór nie ma napisów w YT.';
                document.getElementById('status').style.background = '#3d2612';
                document.getElementById('subtitle-box').innerText = 'Brak dostępnych napisów.';
            }
        }

        function loadVideoFromInput() {
            const url = document.getElementById('url-input').value;
            const videoId = extractVideoId(url);
            if (!videoId) {
                alert('Nieprawidłowy link do YouTube!');
                return;
            }
            loadVideo(videoId);
        }

        // Inteligentne wyszukiwanie po tytule zamieniane na bezpośredni link/zapytanie
        async function searchAndPlay() {
            const query = document.getElementById('search-input').value.trim();
            if (!query) return;

            // Jeśli użytkownik wkleił link w pole szukania
            const directId = extractVideoId(query);
            if (directId) {
                loadVideo(directId);
                return;
            }

            document.getElementById('status').innerText = `Szukam "${query}"...`;
            
            // Używamy publicznego zapytania RSS/JSON YouTube, aby wyciągnąć pierwsze ID filmu pasującego do frazy
            try {
                const searchUrl = `https://www.youtube.com/results?search_query=${encodeURIComponent(query)}`;
                // Ponieważ przeglądarka blokuje bezpośredni fetch HTML z YouTube przez CORS, 
                // przekierowujemy sprytne wyszukiwanie do oficjalnego embeda poprzez bezkosztowe wyszukanie w tle lub 
                // podpowiadamy użytkownikowi link. 
                // Najstabilniejsza metoda bez drogich kluczy API to otwarcie wyszukiwania lub użycie bazy alternatywnej.
            } catch(e) {}

            // Alternatywne, w pełni działające rozwiązanie bez błędów CORS: 
            // Otwieramy wyszukiwanie w locie lub przekierowujemy do okienka z gotowym linkiem.
            // Zrobimy to jeszcze prościej: użyjemy sprytnego parsera linków lub wpiszemy link bezpośrednio.
            // Pokażmy komunikat ułatwiający skopiowanie linku z YouTube:
            window.open(`https://www.youtube.com/results?search_query=${encodeURIComponent(query)}`, '_blank');
            document.getElementById('status').innerText = 'Wybierz film z nowej karty i wklej jego link poniżej!';
            document.getElementById('status').style.background = '#3d2612';
        }

        function parseSubtitles(xml) {
            subtitles = [];
            const parser = new DOMParser();
            const xmlDoc = parser.parseFromString(xml, "text/xml");
            const textNodes = xmlDoc.getElementsByTagName("text");

            for (let node of textNodes) {
                const start = parseFloat(node.getAttribute("start"));
                const dur = parseFloat(node.getAttribute("dur")) || 3;
                let text = node.textContent || "";
                text = text.replace(/&#39;/g, "'").replace(/&amp;/g, "&").replace(/&quot;/g, '"');
                subtitles.push({ start, end: start + dur, text });
            }
        }

        function onPlayerStateChange(event) {
            if (event.data === YT.PlayerState.PLAYING) {
                if (timeInterval) clearInterval(timeInterval);
                timeInterval = setInterval(updateSubtitles, 250);
            } else {
                if (timeInterval) clearInterval(timeInterval);
            }
        }

        function updateSubtitles() {
            if (!player || !player.getCurrentTime) return;
            const currentTime = player.getCurrentTime();
            
            const currentSub = subtitles.find(s => currentTime >= s.start && currentTime <= s.end);
            const box = document.getElementById('subtitle-box');
            
            if (currentSub) {
                box.innerText = currentSub.text;
            } else {
                box.innerText = "";
            }
        }
    </script>
</body>
</html>
