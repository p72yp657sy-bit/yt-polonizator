<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POLSKI YOUTUBE (Chat 4.0 - Tekst i Tłumaczenie)</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            background: #09090b; 
            background-image: 
                radial-gradient(circle at 15% 20%, rgba(236, 72, 153, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 85% 80%, rgba(59, 130, 246, 0.15) 0%, transparent 40%),
                linear-gradient(to bottom, #09090b, #18181b);
            color: #fff; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            margin: 0; 
            padding: 15px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh;
        }
        .container { width: 100%; max-width: 600px; display: flex; flex-direction: column; gap: 15px; }
        
        .brand-header {
            text-align: center;
            padding: 20px 10px;
            background: linear-gradient(135deg, rgba(236, 72, 153, 0.1), rgba(139, 92, 246, 0.1));
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            position: relative;
            overflow: hidden;
        }
        .brand-header::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 3px;
            background: linear-gradient(90deg, #ec4899, #8b5cf6, #3b82f6);
        }
        .brand-title {
            font-size: 30px;
            font-weight: 900;
            letter-spacing: -1px;
            background: linear-gradient(135deg, #ff2a85, #ff7e5f, #feb47b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0;
            text-transform: uppercase;
        }
        .brand-subtitle {
            font-size: 12px;
            color: #a1a1aa;
            margin-top: 6px;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 600;
        }

        .input-group { display: flex; gap: 8px; }
        input { 
            flex: 1; 
            padding: 14px 16px; 
            border-radius: 10px; 
            border: 1px solid #27272a; 
            background: #121214; 
            color: #fff; 
            font-size: 15px;
            outline: none;
            transition: all 0.2s;
        }
        input:focus { border-color: #ec4899; box-shadow: 0 0 12px rgba(236, 72, 153, 0.2); }
        
        button { 
            padding: 14px 22px; 
            border-radius: 10px; 
            border: none; 
            background: linear-gradient(135deg, #ec4899, #8b5cf6); 
            color: #fff; 
            font-weight: bold; 
            font-size: 15px;
            cursor: pointer; 
            box-shadow: 0 4px 15px rgba(236, 72, 153, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        button:active { transform: scale(0.97); }

        #results-container {
            display: none;
            flex-direction: column;
            gap: 8px;
            background: #121214;
            border: 1px solid #27272a;
            border-radius: 10px;
            padding: 10px;
            max-height: 260px;
            overflow-y: auto;
        }
        .result-item {
            padding: 12px;
            background: #18181b;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            color: #e4e4e7;
            border: 1px solid #27272a;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.2s;
        }
        .result-item:hover { border-color: #ec4899; background: #27272a; color: #fff; }

        .player-container { 
            position: relative; 
            width: 100%; 
            padding-bottom: 56.25%; 
            height: 0; 
            background: #000; 
            border-radius: 12px; 
            overflow: hidden; 
            border: 1px solid #27272a;
            box-shadow: 0 8px 25px rgba(0,0,0,0.6);
        }
        .player-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
        
        #status { 
            padding: 12px; 
            text-align: center; 
            font-weight: 600; 
            font-size: 14px;
            border-radius: 10px; 
            background: #143821; 
            border: 1px solid #27272a;
            color: #4ade80;
        }
        
        .lyrics-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        
        .lyrics-box { 
            padding: 15px; 
            background: #121214; 
            border-radius: 12px; 
            max-height: 220px;
            overflow-y: auto;
            font-size: 14px; 
            font-weight: 500; 
            color: #facc15; 
            border: 2px solid #3f3f46; 
            box-shadow: inset 0 2px 15px rgba(0,0,0,0.9);
            line-height: 1.5;
            white-space: pre-line;
            word-break: break-word;
        }
        .lyrics-box h3 { margin-top: 0; font-size: 13px; text-transform: uppercase; color: #a1a1aa; border-bottom: 1px solid #27272a; padding-bottom: 5px; }

        .nav-link { text-align: center; margin-top: 10px; font-size: 13px; display: flex; justify-content: center; gap: 20px; }
        .nav-link a { color: #71717a; text-decoration: none; }
        .nav-link a:hover { color: #f43f5e; }
    </style>
</head>
<body>
    <div class="container">
        <div class="brand-header">
            <h1 class="brand-title">Polski YouTube</h1>
            <div class="brand-subtitle">Wersja 4.0 – Żądania i Teksty z Vercela</div>
        </div>
        
        <!-- Główny input na tytuł/wykonawcę z przyciskiem strzałki -->
        <div class="input-group">
            <input type="text" id="song-input" placeholder="Wpisz tytuł i wykonawcę piosenki..." onkeydown="if(event.key==='Enter') requestSongLyrics()">
            <button onclick="requestSongLyrics()" id="send-btn">➔</button>
        </div>

        <div id="results-container"></div>

        <div class="player-container">
            <div id="player"></div>
        </div>
        
        <div id="status">Status: Oczekiwanie na zapytanie...</div>
        
        <!-- Sekcja na oryginalny tekst i tłumaczenie -->
        <div class="lyrics-grid">
            <div class="lyrics-box" id="original-lyrics">
                <h3>Oryginalny tekst</h3>
                <p style="color: #71717a; font-weight: normal;">Tutaj pojawi się tekst utworu...</p>
            </div>
            <div class="lyrics-box" id="translated-lyrics" style="color: #38bdf8;">
                <h3>Polskie tłumaczenie</h3>
                <p style="color: #71717a; font-weight: normal;">Tutaj pojawi się tłumaczenie...</p>
            </div>
        </div>

        <div class="nav-link">
            <a href="chat-3.1.html">← Wróć do wersji 3.1</a>
        </div>
    </div>

    <script>
        const VERCEL_API_URL = "https://yt-polonizator-backend-rsbl.vercel.app";



        function loadVideo(videoId) {
            if (!videoId) return;
            const playerContainer = document.querySelector('.player-container');
            playerContainer.innerHTML = `<iframe src="https://www.youtube.com/embed/${videoId}?autoplay=1" title="YouTube video player" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>`;
        }

        async function requestSongLyrics() {
            const query = document.getElementById('song-input').value.trim();
            if (!query) {
                alert("Wpisz tytuł lub wykonawcę!");
                return;
            }

            document.getElementById('status').innerText = `Wysyłanie zapytania do Vercela dla: "${query}"...`;
            
            try {
                // Wywołanie endpointu backendu na Vercelu (metoda POST)
                const response = await fetch(`${VERCEL_API_URL}/api/lyrics`, {
 {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ query: query })
                });

                if (!response.ok) {
                    throw new Error('Błąd serwera Vercel');
                }

                const data = await response.json();
                
                // Oczekiwana struktura z Vercela: { videoId, title, artist, original, translated }
                if (data.videoId) {
                    loadVideo(data.videoId);
                }

                document.getElementById('status').innerText = `Odtwarzanie: ${data.artist || ''} - ${data.title || query}`;
                
                // Wypełnienie okienek z tekstami
                document.getElementById('original-lyrics').innerHTML = `<h3>Oryginalny tekst</h3>${data.original || 'Brak oryginalnego tekstu.'}`;
                document.getElementById('translated-lyrics').innerHTML = `<h3>Polskie tłumaczenie</h3>${data.translated || 'Brak tłumaczenia.'}`;

            } catch (err) {
                console.error(err);
                document.getElementById('status').innerText = 'Błąd komunikacji z backendem Vercel.';
                alert('Nie udało się pobrać danych z serwera. Sprawdź konsolę.');
            }
        }
    </script>
</body>
</html>
