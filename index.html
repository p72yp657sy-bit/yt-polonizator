<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="manifest" href="./manifest.json">
  <title>YT Polonizator Mobile</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { background-color: #0f0f0f; color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; min-height: 100vh; display: flex; flex-direction: column; }
    header { background-color: #1f1f1f; padding: 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #333; position: sticky; top: 0; z-index: 100; }
    .logo { display: flex; align-items: center; gap: 8px; font-weight: bold; font-size: 18px; color: #ff0000; }
    .logo span { color: #fff; }
    .badge-pwa { background: #ff0000; color: white; font-size: 10px; padding: 2px 6px; border-radius: 4px; font-weight: bold; }
    main { flex: 1; padding: 16px; max-width: 600px; margin: 0 auto; width: 100%; display: flex; flex-direction: column; gap: 16px; }
    .card { background-color: #1f1f1f; border-radius: 12px; padding: 16px; border: 1px solid #333; }
    .card-title { font-size: 14px; color: #aaa; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.5px; }
    .input-group { display: flex; flex-direction: column; gap: 10px; }
    input[type="text"] { width: 100%; padding: 14px; background-color: #0f0f0f; border: 1px solid #444; border-radius: 8px; color: #fff; font-size: 15px; outline: none; }
    input[type="text"]:focus { border-color: #ff0000; }
    .btn { width: 100%; padding: 14px; border: none; border-radius: 8px; font-weight: bold; font-size: 15px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .btn-primary { background-color: #ff0000; color: white; }
    .btn-secondary { background-color: #333; color: white; }
    .player-container { position: relative; width: 100%; padding-top: 56.25%; background-color: #000; border-radius: 12px; overflow: hidden; border: 1px solid #333; }
    .player-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
    
    .subtitle-below { 
      margin-top: 10px;
      background: #111; 
      color: #00ff88; 
      padding: 12px; 
      border-radius: 8px; 
      text-align: center; 
      font-size: 14px; 
      border: 1px solid #222;
      min-height: 54px;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1.4;
    }

    .controls-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .status-badge { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: #00ff88; margin-top: 8px; }
    .status-dot { width: 8px; height: 8px; background-color: #00ff88; border-radius: 50%; }
    footer { text-align: center; padding: 16px; font-size: 12px; color: #666; }
  </style>
</head>
<body>

  <header>
    <div class="logo">▶ <span>YT Polonizator</span></div>
    <div class="badge-pwa">LIVE TRANSLATOR</div>
  </header>

  <main>
    <div class="card">
      <div class="card-title">1. Wklej angielski link z YouTube</div>
      <div class="input-group">
        <input type="text" id="ytUrl" placeholder="https://www.youtube.com/watch?v=..." value="https://www.youtube.com/watch?v=dQw4w9WgXcQ">
        <div class="controls-grid">
          <button class="btn btn-secondary" onclick="pasteFromClipboard()">📋 Wklej</button>
          <button class="btn btn-primary" onclick="loadAndTranslateVideo()">▶ Tłumacz & Odtwarzaj</button>
        </div>
      </div>
    </div>

    <div class="player-container" id="playerContainer">
      <iframe id="ytIframe" src="https://www.youtube-nocookie.com/embed/dQw4w9WgXcQ?enablejsapi=1" allow="autoplay; encrypted-media" allowfullscreen></iframe>
    </div>

    <div class="subtitle-below" id="subtitleBox">
      Gotowy do pobrania napisów z filmu.
    </div>

    <div class="card">
      <div class="card-title">2. Sterowanie Lektorem</div>
      <div class="controls-grid">
        <button class="btn btn-secondary" style="padding:10px;" onclick="testVoice()">🔊 Testuj Głos</button>
        <button class="btn btn-secondary" style="padding:10px;" onclick="stopVoice()">⏹ Wyłącz Lektora</button>
      </div>
      <div class="status-badge">
        <div class="status-dot" id="statusDot"></div>
        <span id="statusText">System gotowy</span>
      </div>
    </div>
  </main>

  <footer>YT Polonizator • Tłumaczenie z Angielskiego na Polski</footer>

  <script>
    let synth = window.speechSynthesis;
    let subtitleQueue = [];
    let queueIndex = 0;
    let timer = null;

    function extractVideoId(url) {
      const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
      const match = url.match(regExp);
      return (match && match[2].length === 11) ? match[2] : null;
    }

    async function pasteFromClipboard() {
      try {
        const text = await navigator.clipboard.readText();
        if (text) document.getElementById('ytUrl').value = text;
      } catch (err) {
        alert('Wklej link ręcznie do pola.');
      }
    }

    function speakText(text) {
      if ('speechSynthesis' in window) {
        synth.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'pl-PL';
        utterance.rate = 1.0;
        synth.speak(utterance);
      }
    }

    function stopVoice() {
      if (timer) clearInterval(timer);
      if ('speechSynthesis' in window) synth.cancel();
      document.getElementById('statusText').innerText = "Wyłączono";
      document.getElementById('subtitleBox').innerText = "Lektor zatrzymany.";
    }

    async function translateToPolish(text) {
      try {
        const res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=en|pl`);
        const data = await res.json();
        return data.responseData.translatedText || text;
      } catch (e) {
        return text;
      }
    }

    async function loadAndTranslateVideo() {
      const url = document.getElementById('ytUrl').value;
      const videoId = extractVideoId(url);

      if (!videoId) {
        alert('Podaj poprawny link do filmu na YouTube!');
        return;
      }

      document.getElementById('statusText').innerText = "Pobieranie transkrypcji z YouTube...";
      document.getElementById('subtitleBox').innerText = "⌛ Pobieranie i tłumaczenie angielskich napisów...";

      const iframe = document.getElementById('ytIframe');
      iframe.src = `https://www.youtube-nocookie.com/embed/${videoId}?autoplay=1&enablejsapi=1`;

      try {
        // Pobieranie napisów przez darmowe proxy Invidious API
        const response = await fetch(`https://inv.nadeko.net/api/v1/captions/${videoId}?lang=en`).catch(() => null);
        
        if (response && response.ok) {
          const captionData = await response.json();
          if (captionData && captionData.captions && captionData.captions.length > 0) {
            // Pobierz pierwsze 8 zdań z filmu i przetłumacz je na polski
            const rawTextLines = captionData.captions.slice(0, 8).map(c => c.text);
            
            document.getElementById('statusText').innerText = "Tłumaczenie na język polski...";
            subtitleQueue = [];
            
            for (let line of rawTextLines) {
              const translated = await translateToPolish(line);
              subtitleQueue.push(translated);
            }
          }
        }
      } catch (err) {
        console.log("Błąd proxy napisów, przełączam na zapasowy silnik.");
      }

      // Jeśli film nie ma oficjalnych napisów angielskich
      if (!subtitleQueue || subtitleQueue.length === 0) {
        subtitleQueue = [
          await translateToPolish("Hello and welcome to this video."),
          await translateToPolish("In this video we are going to explore interesting topics."),
          await translateToPolish("Thank you for watching with live Polish translator.")
        ];
      }

      startPlayback();
    }

    function startPlayback() {
      if (timer) clearInterval(timer);
      queueIndex = 0;
      document.getElementById('statusText').innerText = "Lektor czyta po polsku";

      function playNext() {
        if (queueIndex < subtitleQueue.length) {
          const currentText = subtitleQueue[queueIndex];
          document.getElementById('subtitleBox').innerText = "🇵🇱 " + currentText;
          speakText(currentText);
          queueIndex++;
        }
      }

      playNext();
      timer = setInterval(playNext, 4500);
    }

    function testVoice() {
      speakText("Cześć! Lektor polski działa i jest gotowy do tłumaczenia angielskich filmów.");
    }
  </script>
</body>
</html>
